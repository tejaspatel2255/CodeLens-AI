<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="lensRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5C4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#7C6DFA" />
    </linearGradient>

    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5C4" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <radialGradient id="glassReflection" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00F5C4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="100" fill="#090D16" />

  <!-- Outer Neon Lens Ring (Glow Layer) -->
  <circle cx="230" cy="230" r="160" fill="none" stroke="url(#lensRingGrad)" stroke-width="18" filter="url(#cyanGlow)" />

  <!-- Outer Neon Lens Ring (Sharp Layer) -->
  <circle cx="230" cy="230" r="160" fill="none" stroke="url(#lensRingGrad)" stroke-width="12" />

  <!-- Magnifier Handle (Glow & Sharp) -->
  <path d="M 345 345 L 435 435" stroke="url(#lensRingGrad)" stroke-width="26" stroke-linecap="round" filter="url(#purpleGlow)" opacity="0.6" />
  <path d="M 345 345 L 435 435" stroke="url(#lensRingGrad)" stroke-width="18" stroke-linecap="round" />

  <!-- Glass Lens Sphere Texture -->
  <circle cx="230" cy="230" r="148" fill="url(#glassReflection)" />
  <circle cx="230" cy="230" r="148" fill="none" stroke="#00F5C4" stroke-width="2" stroke-opacity="0.4" />

  <!-- Inner Glowing Code Symbol { </ > } -->
  <g transform="translate(230, 230)" filter="url(#cyanGlow)">
    <!-- Outer Curly Brackets { } -->
    <path d="M -95 -50 C -115 -50 -115 -10 -130 0 C -115 10 -115 50 -95 50" fill="none" stroke="url(#codeGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 95 -50 C 115 -50 115 -10 130 0 C 115 10 115 50 95 50" fill="none" stroke="url(#codeGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Angle Brackets < > -->
    <path d="M -55 -25 L -80 0 L -55 25" fill="none" stroke="#00F5C4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 55 -25 L 80 0 L 55 25" fill="none" stroke="#7C6DFA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Slash / -->
    <line x1="-12" y1="42" x2="12" y2="-42" stroke="url(#codeGrad)" stroke-width="11" stroke-linecap="round" />
  </g>
</svg>
